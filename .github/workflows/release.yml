name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on master
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check tag ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...master" --jq .status)"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Tag commit is not on master (comparison status: $status)." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable: codecks-mcp.exe
            archive: codecks-mcp-x86_64-pc-windows-msvc.zip
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: codecks-mcp
            archive: codecks-mcp-x86_64-unknown-linux-gnu.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: codecks-mcp
            archive: codecks-mcp-x86_64-apple-darwin.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: codecks-mcp
            archive: codecks-mcp-aarch64-apple-darwin.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package codecks-mcp --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" release-assets/
          Compress-Archive -Path "release-assets/${{ matrix.executable }}" -DestinationPath "release-assets/${{ matrix.archive }}"
          Remove-Item "release-assets/${{ matrix.executable }}"
          $hash = (Get-FileHash "release-assets/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.archive }}" | Set-Content "release-assets/${{ matrix.archive }}.sha256" -NoNewline

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" release-assets/
          tar -C release-assets -czf "release-assets/${{ matrix.archive }}" "${{ matrix.executable }}"
          rm "release-assets/${{ matrix.executable }}"
          cd release-assets
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
